# Local Postgres for development: docker compose up -d db
# The app connects with the default DATABASE_URL (postgres://postgres:postgres@localhost:5432/forma_local),
# so nothing needs to be set. In the cloud, Forma uses Cloud SQL instead (docs/cloud.md).
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forma_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - forma-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forma_local"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  forma-pgdata:
